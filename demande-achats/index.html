<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demandes d'Achat – PR-ACH-001</title>
<style>
:root{
  --bg:#f4f6f9; --surface:#fff; --surface-2:#f8fafc; --border:#dfe4ea; --text:#1d2733; --muted:#66727f;
  --primary:#1f5fbf; --primary-ink:#fff; --primary-soft:#e7effb;
  --ok:#1e8a4c; --ok-soft:#e5f5ec; --warn:#b76e00; --warn-soft:#fff3dc; --danger:#c0362c; --danger-soft:#fdeceb;
  --grey-soft:#eef1f4; --violet:#6a3fb5; --violet-soft:#f0eafb;
  --radius:10px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11161c; --surface:#1a2129; --surface-2:#202933; --border:#2e3945; --text:#e6ebf0; --muted:#98a4b1;
    --primary:#5b9bff; --primary-ink:#0b1320; --primary-soft:#1d2d45;
    --ok:#4cc083; --ok-soft:#173226; --warn:#f0a93a; --warn-soft:#3a2c14; --danger:#ff7a6e; --danger-soft:#3d1c1a;
    --grey-soft:#26303a; --violet:#b294f0; --violet-soft:#2b2340;
  }
}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--primary)}
header.top{background:var(--surface);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.top-inner{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:8px}
.brand small{display:block;font-weight:400;color:var(--muted);font-size:11px}
nav.menu{display:flex;gap:4px;flex-wrap:wrap}
nav.menu a{padding:7px 11px;border-radius:8px;text-decoration:none;color:var(--text)}
nav.menu a.active,nav.menu a:hover{background:var(--primary-soft);color:var(--primary)}
.user{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.user input,.user select{padding:6px 8px;font-size:13px}
.mode{font-size:11px;padding:3px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:600}
.mode.sb{background:var(--ok-soft);color:var(--ok)}
main{max-width:1200px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:21px;margin:4px 0 14px}
h2{font-size:16px;margin:0 0 12px}
h3{font-size:14px;margin:14px 0 8px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card.action{border-left:4px solid var(--primary)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}.user{margin-left:0}}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
label.req::after{content:" *";color:var(--danger)}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font:inherit}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft);border-color:var(--primary)}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--text);font-weight:400;margin:4px 0}
.check input{width:auto;margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
.b-grey{background:var(--grey-soft);color:var(--muted)}
.b-blue{background:var(--primary-soft);color:var(--primary)}
.b-ok{background:var(--ok-soft);color:var(--ok)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.b-danger{background:var(--danger-soft);color:var(--danger)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.kpi{padding:14px}
.kpi .v{font-size:26px;font-weight:700}
.kpi .l{color:var(--muted);font-size:12px}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12px;color:var(--muted);background:var(--surface-2);white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.retenue td{background:var(--ok-soft)}
.best{color:var(--ok);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:12px}
.info dl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 18px;margin:0}
@media (max-width:800px){.info dl{grid-template-columns:1fr 1fr}}
.info dt{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.info dd{margin:2px 0 0;word-break:break-word}
.urgent-banner{background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);padding:8px 12px;border-radius:8px;font-weight:700;margin-bottom:12px}
.alert{padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--primary-soft);color:var(--primary)}
.alert.danger{background:var(--danger-soft);color:var(--danger)}
.stepper{display:flex;gap:0;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.step{flex:1;min-width:92px;text-align:center;position:relative;font-size:11px;color:var(--muted)}
.step .dot{width:26px;height:26px;border-radius:50%;margin:0 auto 4px;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--grey-soft);color:var(--muted);position:relative;z-index:1}
.step::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border)}
.step:first-child::before{display:none}
.step.done .dot{background:var(--ok);color:#fff}
.step.done::before,.step.current::before{background:var(--ok)}
.step.current .dot{background:var(--primary);color:#fff;box-shadow:0 0 0 4px var(--primary-soft)}
.step.current{color:var(--text);font-weight:700}
.stepper.off{opacity:.45}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .link{padding:6px 10px;border-radius:8px;border:1px dashed var(--border);font-size:12px}
.chain .link.ok{border-style:solid;border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.chain .arrow{color:var(--muted)}
.timeline{list-style:none;padding:0;margin:0}
.timeline li{padding:8px 0 8px 16px;border-left:2px solid var(--border);position:relative}
.timeline li::before{content:"";position:absolute;left:-6px;top:13px;width:10px;height:10px;border-radius:50%;background:var(--primary)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}
@media (max-width:800px){.filters{grid-template-columns:1fr}}
.toast{position:fixed;right:16px;bottom:16px;z-index:100;display:flex;flex-direction:column;gap:8px}
.toast div{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);max-width:360px}
.toast div.err{background:var(--danger);color:#fff}
.modal-root{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto}
.modal{background:#fff;color:#111;border-radius:10px;max-width:820px;width:100%;padding:28px}
.modal table th{background:#f2f4f7;color:#444}
.modal th,.modal td{border-bottom:1px solid #ddd}
.bc-head{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #111;padding-bottom:12px;margin-bottom:16px}
.bc-head h2{font-size:22px;margin:0}
.bc-sign{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:40px;font-size:12px}
.bc-sign div{border-top:1px solid #111;padding-top:6px;min-height:60px}
.empty{text-align:center;color:var(--muted);padding:30px}
@media print{
  body.printing > *:not(.modal-root){display:none!important}
  body.printing .modal-root{position:static;background:none;padding:0}
  body.printing .modal{box-shadow:none;padding:0;max-width:none}
  body.printing .no-print{display:none!important}
}

<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">Demandes d'Achat<small>Procédure PR-ACH-001 · v01</small></div>
    <nav class="menu" id="menu">
      <a href="#/" data-r="dash">Tableau de bord</a>
      <a href="#/liste" data-r="liste">Demandes</a>
      <a href="#/nouvelle" data-r="nouvelle">+ Nouvelle DA</a>
      <a href="#/parametres" data-r="param">Paramètres</a>
    </nav>
    <div class="user">
      <span class="mode" id="mode"></span>
      <input id="u-nom" placeholder="Votre nom" style="width:140px" aria-label="Nom utilisateur">
      <select id="u-role" style="width:190px" aria-label="Rôle"></select>
    </div>
  </div>
</header>
<main id="app"><div class="empty">Chargement…</div></main>
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";
/* ===================== Configuration & référentiels ===================== */
const CFG = Object.assign({ SUPABASE_URL: "", SUPABASE_ANON_KEY: "", DEVISE: "MAD" }, window.APP_CONFIG || {});
const USE_SUPABASE = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY);

const ROLES = ["Demandeur","Responsable service","Achats","Technique / Maintenance","Finance","Direction","Magasin / Réception","Comptabilité","Administrateur"];
const SERVICES = ["Production","Maintenance","Logistique","Qualité","HSE","Administration","Commercial","Achats","Informatique","Autre"];
const CATEGORIES = ["Matières premières","Pièces de rechange","Consommables","Équipements et outillages","Prestations de maintenance","Services externes","Fournitures administratives","EPI et équipements de sécurité","Achats clients / projets"];
const UNITES = ["Pce","kg","L","m³","m","m²","Lot","Prestation","Heure","Jour"];
const URGENCES = ["Normal","Urgent","Critique"];
const IMPACTS = ["Production","Client","Sécurité"];
const CONFORMITES = ["À vérifier","Conforme","Non conforme"];
const RANK = { "Responsable service": 1, "Finance": 2, "Direction": 3 };

const STATUTS = {
  brouillon:                 { l: "Brouillon",                   c: "b-grey" },
  soumise:                   { l: "En attente validation",       c: "b-warn" },
  validee:                   { l: "Besoin validé",               c: "b-blue" },
  consultation:              { l: "Consultation fournisseurs",   c: "b-blue" },
  attente_validation_achat:  { l: "Attente validation achat",    c: "b-warn" },
  achat_valide:              { l: "Achat validé",                c: "b-violet" },
  bc_emis:                   { l: "BC émis",                     c: "b-violet" },
  non_conforme:              { l: "Non-conformité",              c: "b-danger" },
  receptionnee:              { l: "Réceptionnée",                c: "b-ok" },
  cloturee:                  { l: "Clôturée",                    c: "b-ok" },
  refusee:                   { l: "Refusée",                     c: "b-danger" },
  annulee:                   { l: "Annulée",                     c: "b-grey" }
};
const STEPS = ["Besoin","Demande","Validation","Consultation","Analyse","Validation achat","BC","Réception","Clôture"];

/* ===================== Utilitaires ===================== */
const mem = {};
const LS = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){ mem[k] = v; } },
  del(k){ try { localStorage.removeItem(k); } catch(e){ delete mem[k]; } }
};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isNaN(n) ? 0 : n; };
const today = () => new Date().toISOString().slice(0,10);
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10); };
const fmtDate = d => d ? new Date(d).toLocaleDateString("fr-FR") : "—";
const fmtDT = d => d ? new Date(d).toLocaleString("fr-FR", { dateStyle:"short", timeStyle:"short" }) : "—";
const money = n => (n === null || n === undefined || n === "") ? "—" :
  new Intl.NumberFormat("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(num(n)) + " " + CFG.DEVISE;
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const opts = (list, sel, empty) => (empty !== undefined ? `<option value="">${esc(empty)}</option>` : "") +
  list.map(v => `<option ${v === sel ? "selected" : ""}>${esc(v)}</option>`).join("");
const badge = s => `<span class="badge ${(STATUTS[s]||{}).c||"b-grey"}">${esc((STATUTS[s]||{}).l||s)}</span>`;
const urgBadge = u => u === "Critique" ? `<span class="badge b-danger">Critique</span>` : u === "Urgent" ? `<span class="badge b-warn">Urgent</span>` : `<span class="badge b-grey">Normal</span>`;

function toast(msg, err){
  const d = document.createElement("div"); d.textContent = msg; if (err) d.className = "err";
  const t = $("#toast"); t.appendChild(d); while (t.children.length > 3) t.firstChild.remove(); setTimeout(() => d.remove(), err ? 6000 : 3000);
}
function formObj(form){
  const o = {};
  for (const el of form.elements){
    if (!el.name) continue;
    if (el.type === "checkbox") o[el.name] = el.checked;
    else if (el.type === "radio") { if (el.checked) o[el.name] = el.value; }
    else o[el.name] = el.value.trim() === "" ? null : el.value.trim();
  }
  return o;
}

/* ===================== Paramètres & utilisateur ===================== */
const DEFAULT_SETTINGS = { entreprise: "Mon entreprise", adresse: "", seuil1: 5000, seuil2: 50000 };
let settings = Object.assign({}, DEFAULT_SETTINGS, JSON.parse(LS.get("da_settings") || "{}"));
let user = Object.assign({ nom: "", role: "Demandeur" }, JSON.parse(LS.get("da_user") || "{}"));
const saveUser = () => LS.set("da_user", JSON.stringify(user));

function niveauRequis(montant){
  if (montant <= num(settings.seuil1)) return "Responsable service";
  if (montant <= num(settings.seuil2)) return "Finance";
  return "Direction";
}
const acteur = () => user.nom || "(anonyme)";

/* ===================== Stockage : local (test) ===================== */
const LocalStore = {
  KEY: "da_db_v1",
  load(){ try { return JSON.parse(LS.get(this.KEY)) || { seq: 0, demandes: [] }; } catch(e){ return { seq: 0, demandes: [] }; } },
  save(db){ LS.set(this.KEY, JSON.stringify(db)); },
  async list(){ return this.load().demandes.slice().sort((a,b) => b.created_at.localeCompare(a.created_at)); },
  async create(data){
    const db = this.load(); db.seq++;
    const now = new Date().toISOString();
    const da = Object.assign({}, data, {
      id: uid(), numero: `DA-${new Date().getFullYear()}-${String(db.seq).padStart(4,"0")}`,
      created_at: now, updated_at: now, offres: [], historique: []
    });
    db.demandes.push(da); this.save(db); return da;
  },
  async update(id, patch){
    const db = this.load(); const da = db.demandes.find(d => d.id === id);
    if (!da) throw new Error("DA introuvable");
    Object.assign(da, patch, { updated_at: new Date().toISOString() }); this.save(db); return da;
  },
  async addOffre(id, offre){
    const db = this.load(); const da = db.demandes.find(d => d.id === id);
    const o = Object.assign({ id: uid(), demande_id: id, created_at: new Date().toISOString() }, offre);
    da.offres.push(o); this.save(db); return o;
  },
  async updateOffre(offreId, patch){
    const db = this.load();
    for (const da of db.demandes){ const o = da.offres.find(x => x.id === offreId); if (o){ Object.assign(o, patch); this.save(db); return o; } }
  },
  async deleteOffre(offreId){
    const db = this.load();
    for (const da of db.demandes){ da.offres = da.offres.filter(x => x.id !== offreId); }
    this.save(db);
  },
  async addLog(id, entry){
    const db = this.load(); const da = db.demandes.find(d => d.id === id);
    da.historique.push(Object.assign({ id: uid(), demande_id: id, created_at: new Date().toISOString() }, entry)); this.save(db);
  },
  async reset(){ LS.del(this.KEY); }
};

/* ===================== Stockage : Supabase ===================== */
function SupabaseStore(sb){
  const chk = ({ data, error }) => { if (error) throw new Error(error.message); return data; };
  return {
    async list(){
      const rows = chk(await sb.from("demandes").select("*, offres(*), historique(*)").order("created_at", { ascending: false }));
      rows.forEach(r => { r.offres = r.offres || []; r.historique = r.historique || []; });
      return rows;
    },
    async create(data){
      const row = chk(await sb.from("demandes").insert(data).select().single());
      row.offres = []; row.historique = []; return row;
    },
    async update(id, patch){ return chk(await sb.from("demandes").update(patch).eq("id", id).select().single()); },
    async addOffre(id, offre){ return chk(await sb.from("offres").insert(Object.assign({ demande_id: id }, offre)).select().single()); },
    async updateOffre(offreId, patch){ return chk(await sb.from("offres").update(patch).eq("id", offreId).select().single()); },
    async deleteOffre(offreId){ chk(await sb.from("offres").delete().eq("id", offreId)); },
    async addLog(id, entry){ chk(await sb.from("historique").insert(Object.assign({ demande_id: id }, entry))); },
    async reset(){ throw new Error("Réinitialisation désactivée en mode Supabase."); }
  };
}
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("Chargement impossible : " + src)); document.head.appendChild(s); });
}

let store = LocalStore;
let DB = [];   // cache des demandes
async function reload(){ DB = await store.list(); }
const findDA = id => DB.find(d => d.id === id);

/* ===================== Règles métier / habilitations (§14) ===================== */
const isAdmin = () => user.role === "Administrateur";
const has = (...roles) => isAdmin() || roles.includes(user.role);
const estUrgent = da => da.urgence && da.urgence !== "Normal";
const montantOffre = (o, da) => num(o.prix_unitaire_ht) * num(da.quantite) + num(o.cout_transport);
const offreRetenue = da => (da.offres || []).find(o => o.id === da.offre_retenue_id);

const CAN = {
  modifier:          da => da.statut === "brouillon" && has("Demandeur"),
  soumettre:         da => da.statut === "brouillon" && has("Demandeur"),
  validerBesoin:     da => da.statut === "soumise" && (has("Responsable service") || (estUrgent(da) && user.role === "Direction")),
  lancerConsultation:da => da.statut === "validee" && has("Achats"),
  gererOffres:       da => da.statut === "consultation" && has("Achats"),
  avisTechnique:     da => da.statut === "consultation" && has("Achats","Technique / Maintenance"),
  validerAchat:      da => da.statut === "attente_validation_achat" &&
                           (isAdmin() || (RANK[user.role] || 0) >= (RANK[da.validation_achat_niveau] || 9)),
  emettreBC:         da => da.statut === "achat_valide" && has("Achats"),
  confirmerBC:       da => da.statut === "bc_emis" && !da.bc_confirme && has("Achats"),
  receptionner:      da => ["bc_emis","non_conforme"].includes(da.statut) && has("Magasin / Réception"),
  traiterNC:         da => da.statut === "non_conforme" && has("Achats"),
  cloturer:          da => da.statut === "receptionnee" && has("Comptabilité"),
  annuler:           da => ["brouillon","soumise","validee","consultation","attente_validation_achat","achat_valide"].includes(da.statut) && has("Demandeur","Achats")
};
const MAIN_ACTIONS = ["soumettre","validerBesoin","lancerConsultation","gererOffres","avisTechnique","validerAchat","emettreBC","confirmerBC","receptionner","traiterNC","cloturer"];
const aTraiter = da => {
  if (user.role === "Demandeur" && !isAdmin()) return da.statut === "brouillon" && (!user.nom || da.demandeur === user.nom);
  if (user.role === "Technique / Maintenance") return CAN.avisTechnique(da) && (da.offres||[]).some(o => o.conformite_technique === "À vérifier");
  return MAIN_ACTIONS.some(a => CAN[a](da));
};

function stepIndex(da){
  switch (da.statut){
    case "brouillon": return 1;
    case "soumise": return 2;
    case "validee": return 3;
    case "consultation": return (da.offres||[]).length ? 4 : 3;
    case "attente_validation_achat": return 5;
    case "achat_valide": return 6;
    case "bc_emis": case "non_conforme": return 7;
    case "receptionnee": return 8;
    case "cloturee": return 9;
    default: return -1;
  }
}

async function act(da, patch, action, commentaire){
  if (patch) await store.update(da.id, patch);
  await store.addLog(da.id, { acteur: acteur(), role: user.role, action, commentaire: commentaire || null });
  await reload();
  toast(action);
  render();
}

function tableDA(list, emptyMsg, compact){
  if (!list.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  return `<div class="table-wrap"><table><thead><tr>
    <th>N° DA</th><th>Date</th>${compact ? "" : "<th>Demandeur</th><th>Service</th>"}<th>Désignation</th><th>Qté</th><th>Urgence</th><th>Souhaitée le</th><th>Statut</th>

    <td>${esc(d.designation)}</td><td>${esc(d.quantite)} ${esc(d.unite)}</td><td>${urgBadge(d.urgence)}</td>
    <td>${fmtDate(d.date_souhaitee)}</td><td>${badge(d.statut)}</td></tr>`).join("")}
  </tbody></table></div>`;
}

}

}

/* --- Étapes 4 & 5 : consultation + analyse des offres (§7, §8) --- */
function secConsultation(da){
  if (CAN.lancerConsultation(da)) return `
  <div class="card action"><h2>Étape 4 – Consultation des fournisseurs</h2>
    <p class="small muted">Demande validée. Le service Achats lance la consultation (devis, délais, conditions de paiement, garantie, transport, caractéristiques techniques).</p>
    <button class="btn primary" data-act="lancerConsultation" data-id="${da.id}">Lancer la consultation</button>
  </div>`;
  if (!["consultation","attente_validation_achat","achat_valide","bc_emis","non_conforme","receptionnee","cloturee"].includes(da.statut) && !(da.offres||[]).length) return "";
  const offres = da.offres || [];
  const gerer = CAN.gererOffres(da), tech = CAN.avisTechnique(da);
  const totals = offres.map(o => montantOffre(o, da));
  const minT = Math.min(...totals), minD = Math.min(...offres.map(o => o.delai_jours == null ? Infinity : num(o.delai_jours)));
  const s1 = num(settings.seuil1), s2 = num(settings.seuil2);
  const table = offres.length ? `<div class="table-wrap"><table><thead><tr>
      ${gerer ? "<th>Retenir</th>" : ""}<th>Fournisseur</th><th>PU HT</th><th>Transport</th><th>Total HT</th><th>Délai (j)</th><th>Paiement</th><th>Garantie</th><th>Disponibilité</th><th>Conformité technique</th><th>Réf. devis / remarques</th>${gerer ? "<th></th>" : ""}
    </tr></thead><tbody>
    ${offres.map((o,i) => `<tr class="${o.id === da.offre_retenue_id ? "retenue" : ""}">
      ${gerer ? `<td><input type="radio" name="offre_retenue_id" value="${o.id}" form="f-choix" ${o.id === da.offre_retenue_id ? "checked" : ""}></td>` : ""}
      <td><b>${esc(o.fournisseur)}</b>${o.id === da.offre_retenue_id ? ` <span class="badge b-ok">Retenue</span>` : ""}</td>
      <td>${money(o.prix_unitaire_ht)}</td><td>${money(o.cout_transport || 0)}</td>
      <td class="${offres.length > 1 && totals[i] === minT ? "best" : ""}">${money(totals[i])}</td>
      <td class="${offres.length > 1 && num(o.delai_jours) === minD ? "best" : ""}">${esc(o.delai_jours ?? "—")}</td>
      <td>${esc(o.conditions_paiement || "—")}</td><td>${esc(o.garantie || "—")}</td><td>${esc(o.disponibilite || "—")}</td>
      <td>${tech ? `<select data-change="conformite" data-offre="${o.id}" data-id="${da.id}">${opts(CONFORMITES, o.conformite_technique || "À vérifier")}</select>`
        : `<span class="badge ${o.conformite_technique === "Conforme" ? "b-ok" : o.conformite_technique === "Non conforme" ? "b-danger" : "b-warn"}">${esc(o.conformite_technique || "À vérifier")}</span>`}</td>
      <td class="small">${esc(o.remarques || "")}</td>
      ${gerer ? `<td><button class="btn sm ghost" data-act="supprOffre" data-offre="${o.id}" data-id="${da.id}" title="Supprimer">✕</button></td>` : ""}
    </tr>`).join("")}</tbody></table></div>` : `<div class="empty">Aucune offre enregistrée.</div>`;

  return `
  <div class="card ${gerer || tech ? "action" : ""}">
    <h2>Étapes 4 & 5 – Consultation et analyse des offres</h2>
    <p class="small muted">Critères de comparaison : prix, qualité / conformité technique, délai, conditions de paiement, garantie, disponibilité, coût de transport, historique fournisseur, conditions commerciales.</p>
    ${table}
    ${gerer ? `
    <details style="margin-top:12px" ${offres.length ? "" : "open"}><summary class="btn sm">+ Ajouter une offre fournisseur</summary>
      <form data-form="addOffre" data-id="${da.id}" style="margin-top:10px">
        <div class="grid g4">
          <div><label class="req">Fournisseur</label><input name="fournisseur" required></div>
          <div><label class="req">Prix unitaire HT</label><input name="prix_unitaire_ht" type="number" step="any" min="0" required></div>
          <div><label>Coût transport</label><input name="cout_transport" type="number" step="any" min="0"></div>
          <div><label>Délai livraison (jours)</label><input name="delai_jours" type="number" min="0"></div>
          <div><label>Conditions de paiement</label><input name="conditions_paiement" placeholder="ex : 60 j fin de mois"></div>
          <div><label>Garantie</label><input name="garantie" placeholder="ex : 12 mois"></div>
          <div><label>Disponibilité</label><input name="disponibilite" placeholder="ex : En stock"></div>
          <div><label>Conformité technique</label><select name="conformite_technique">${opts(CONFORMITES, "À vérifier")}</select></div>
          <div style="grid-column:1/-1"><label>Réf. devis / remarques (historique fournisseur, conditions commerciales…)</label><input name="remarques"></div>
        </div>
        <div class="btns"><button class="btn primary" type="submit">Ajouter l'offre</button></div>
      </form>
    </details>
    ${offres.length ? `
    <form id="f-choix" data-form="soumettreAchat" data-id="${da.id}" style="margin-top:14px">
      <h3>Choix du fournisseur et soumission à validation (§8, §9)</h3>
      <div class="small muted">Matrice : ≤ ${money(s1)} → Responsable service · ≤ ${money(s2)} → Finance · au-delà → Direction.</div>
      ${offres.length < 2 && totals.some(t => t > s1) ? `<div class="alert warn">Achat important : une comparaison d'au moins 2 offres est recommandée. Justifiez l'offre unique le cas échéant.</div>` : ""}
      <div style="margin-top:8px"><label class="req">Justification du choix</label><textarea name="justification_choix" required>${esc(da.justification_choix)}</textarea></div>
      <div class="btns"><button class="btn primary" type="submit">Retenir l'offre cochée et soumettre à validation achat</button></div>
    </form>` : ""}` : ""}
    ${!gerer && da.justification_choix ? `<div style="margin-top:10px"><b class="small">Justification du choix :</b> <span class="small">${esc(da.justification_choix)}</span></div>` : ""}
  </div>`;
}

/* --- Étape 6 : validation de l'achat (§9) --- */
function secValidationAchat(da, ret){
  if (!ret || !["attente_validation_achat","achat_valide","bc_emis","non_conforme","receptionnee","cloturee","refusee"].includes(da.statut) && !da.validation_achat_date) return "";
  const montant = ret ? montantOffre(ret, da) : 0;
  if (da.statut === "attente_validation_achat"){
    const can = CAN.validerAchat(da);
    return `
    <form class="card ${can ? "action" : ""}" data-form="validerAchat" data-id="${da.id}">
      <h2>Étape 6 – Validation de l'achat</h2>
      <div class="info"><dl>

        ${field("Niveau de validation requis", `<span class="badge b-violet">${esc(da.validation_achat_niveau)}</span>`)}
      </dl></div>
      ${can ? `
      <div style="margin-top:10px"><label>Commentaire</label><textarea name="commentaire"></textarea></div>
      <div class="btns">
        <button class="btn ok" type="submit" name="_d" value="valider">Valider l'achat</button>
        <button class="btn" type="submit" name="_d" value="retour">Renvoyer en consultation</button>

  return `<div class="card info"><h2>Étape 6 – Validation de l'achat</h2><dl>

    ${field("Montant", money(montant))}
    ${da.validation_achat_commentaire ? `<div style="grid-column:1/-1"><dt>Commentaire</dt><dd>${esc(da.validation_achat_commentaire)}</dd></div>` : ""}

/* --- Étape 7 : bon de commande (§10) --- */

/* --- Étape 8 : réception (§11) --- */
const CTRL_RECEP = ["Quantité reçue conforme","Produit conforme","État de la marchandise","Référence","Qualité","Documents accompagnants"];
function secReception(da){
  const can = CAN.receptionner(da);
  let out = "";
  if (da.reception_date){
    const c = da.reception_controles || {};
    out += `<div class="card info"><h2>Étape 8 – Réception</h2><dl>
      ${field("Date", fmtDate(da.reception_date))}${field("Par", esc(da.reception_par))}${field("Quantité reçue", esc(da.quantite_recue) + " / " + esc(da.quantite) + " " + esc(da.unite))}
      ${field("Résultat", da.reception_conforme ? `<span class="badge b-ok">Conforme</span>` : `<span class="badge b-danger">Non conforme</span>`)}
      <div style="grid-column:1/-1"><dt>Contrôles</dt><dd>${CTRL_RECEP.map((x,i) => `${c["r"+i] ? "✓" : "✗"} ${esc(x)}`).join(" · ")}</dd></div>
      ${da.reception_remarque ? `<div style="grid-column:1/-1"><dt>Remarque / non-conformité</dt><dd>${esc(da.reception_remarque)}</dd></div>` : ""}
      ${da.nc_traitement ? `<div style="grid-column:1/-1"><dt>Traitement de la non-conformité (Achats)</dt><dd>${esc(da.nc_traitement)}</dd></div>` : ""}
    </dl></div>`;
  }
  if (CAN.traiterNC(da)) out += `
    <form class="card action" data-form="traiterNC" data-id="${da.id}">
      <h2>Traitement de la non-conformité avec le fournisseur</h2>
      <div class="grid g2">
        <div><label class="req">Solution</label><select name="solution" required>${opts(["Remplacement / reliquat livré","Avoir fournisseur","Acceptée avec réserve","Retour fournisseur"], null, "— Choisir —")}</select></div>
        <div><label class="req">Détail</label><input name="detail" required></div>
      </div>
      <div class="btns"><button class="btn ok" type="submit">Réserves traitées</button></div>
      <div class="small muted" style="margin-top:6px">Alternative : le magasin peut enregistrer une nouvelle réception (livraison de remplacement).</div>
    </form>`;
  if (can) out += `
    <form class="card action" data-form="receptionner" data-id="${da.id}">
      <h2>Étape 8 – ${da.reception_date ? "Nouvelle réception" : "Réception"}</h2>
      <div class="grid g3">
        <div><label class="req">Date de réception</label><input type="date" name="reception_date" required value="${today()}"></div>
        <div><label class="req">Quantité reçue (${esc(da.unite)})</label><input type="number" step="any" min="0" name="quantite_recue" required value="${esc(da.quantite)}"></div>
      </div>
      <h3>Contrôles</h3>

      <div class="btns"><button class="btn primary" type="submit">Enregistrer la réception</button></div>

}

      <tr><td>${esc(da.designation)}${da.marque ? "<br><span class='small'>" + esc(da.marque) + " " + esc(da.modele || "") + "</span>" : ""}</td><td>${esc(da.reference || "")}</td>
        <td>${esc(da.quantite)}</td><td>${esc(da.unite)}</td><td>${money(pu)}</td><td>${money(pu * num(da.quantite))}</td></tr>

  </div>`;
  document.body.appendChild(root);
  const close = () => { root.remove(); document.body.classList.remove("printing"); };
  root.addEventListener("click", e => {
    if (e.target === root || e.target.hasAttribute("data-close")) close();
    if (e.target.hasAttribute("data-print")) { document.body.classList.add("printing"); window.print(); document.body.classList.remove("printing"); }

/* ===================== Actions ===================== */
const ACTIONS = {
  async soumettre(el, da){ await act(da, { statut: "soumise" }, "DA soumise à validation"); },
  async annuler(el, da){
    const motif = prompt("Motif de l'annulation ?"); if (motif === null) return;
    await act(da, { statut: "annulee" }, "DA annulée", motif);
  },
  async lancerConsultation(el, da){ await act(da, { statut: "consultation" }, "Consultation fournisseurs lancée"); },
  async supprOffre(el, da){
    if (!confirm("Supprimer cette offre ?")) return;
    const o = da.offres.find(x => x.id === el.dataset.offre);
    if (da.offre_retenue_id === el.dataset.offre) await store.update(da.id, { offre_retenue_id: null });
    await store.deleteOffre(el.dataset.offre);
    await act(da, null, "Offre supprimée", o ? o.fournisseur : "");
  },
  async emettreBC(el, da){
    const ret = offreRetenue(da);
    const bc = da.numero.replace(/^DA-/, "BC-");
    await act(da, { statut: "bc_emis", bc_numero: bc, bc_date: today(), bc_fournisseur: ret.fournisseur, bc_montant: montantOffre(ret, da), bc_confirme: false },
      "BC émis et envoyé au fournisseur", bc + " — " + ret.fournisseur);
  },
  voirBC(el, da){ showBC(da); },
  exportCSV(){
    const cols = ["numero","date_creation","demandeur","service","categorie","designation","reference","quantite","unite","centre_cout","urgence","impact","date_souhaitee","statut","bc_numero","bc_fournisseur","bc_montant","reception_date","facture_numero","facture_montant"];
    const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
    const csv = "﻿" + cols.join(";") + "\n" + DB.map(d => cols.map(c => q(c === "statut" ? (STATUTS[d.statut]||{}).l : d[c])).join(";")).join("\n");
    download("demandes_achat_" + today() + ".csv", csv, "text/csv;charset=utf-8");
  },
  exportJSON(){ download("demandes_achat_" + today() + ".json", JSON.stringify(DB, null, 2), "application/json"); },
  async resetAll(){ if (!confirm("Effacer toutes les demandes stockées dans ce navigateur ?")) return; await store.reset(); await reload(); toast("Données effacées"); render(); },
  async seed(){ await seedDemo(); await reload(); toast("Données de démonstration chargées"); location.hash = "#/liste"; render(); }
};

const FORMS = {
  async saveDA(form, data, mode){
    if (data.urgence !== "Normal" && !data.impact) throw new Error("Précisez l'impact (Production / Client / Sécurité) pour un achat urgent ou critique.");
    if (data.urgence === "Normal") data.impact = null;
    if (data.categorie !== "Pièces de rechange"){ data.marque = null; data.modele = null; }
    const id = form.dataset.id;
    if (id){
      const da = findDA(id);
      if (mode === "soumettre") data.statut = "soumise";
      await store.update(id, data);
      await store.addLog(id, { acteur: acteur(), role: user.role, action: mode === "soumettre" ? "DA modifiée et soumise à validation" : "DA modifiée" });
      await reload(); toast("Demande enregistrée"); location.hash = "#/da/" + da.id;
    } else {
      data.statut = mode === "soumettre" ? "soumise" : "brouillon";
      const da = await store.create(data);
      await store.addLog(da.id, { acteur: acteur(), role: user.role, action: mode === "soumettre" ? "DA créée et soumise à validation" : "DA créée (brouillon)" });
      await reload(); toast("Demande " + da.numero + " créée"); location.hash = "#/da/" + da.id;
    }
  },
  async validerBesoin(form, data, d, da){
    const allChecked = [0,1,2,3,4,5].every(i => data["c" + i]);
    if (d === "valider" && !allChecked) throw new Error("Cochez tous les points de contrôle avant de valider.");
    if (d !== "valider" && !data.commentaire) throw new Error("Un commentaire est obligatoire pour un refus ou un renvoi.");
    const base = { validation_besoin_par: acteur() + " (" + user.role + ")", validation_besoin_date: new Date().toISOString(), validation_besoin_commentaire: data.commentaire };
    if (d === "valider") await act(da, Object.assign(base, { statut: "validee" }), "Besoin validé", data.commentaire);
    else if (d === "refuser") await act(da, Object.assign(base, { statut: "refusee" }), "Demande refusée", data.commentaire);
    else await act(da, { statut: "brouillon" }, "Demande renvoyée au demandeur pour complément", data.commentaire);
  },
  async addOffre(form, data, d, da){
    await store.addOffre(da.id, data);
    await act(da, null, "Offre ajoutée", data.fournisseur + " — PU " + money(data.prix_unitaire_ht));
  },
  async soumettreAchat(form, data, d, da){
    const choix = form.querySelector("input[name=offre_retenue_id]:checked") || document.querySelector("input[name=offre_retenue_id][form=f-choix]:checked");
    if (!choix) throw new Error("Cochez l'offre retenue dans le tableau.");
    const o = da.offres.find(x => x.id === choix.value);
    if (o.conformite_technique === "Non conforme") throw new Error("L'offre sélectionnée est jugée non conforme techniquement.");
    const montant = montantOffre(o, da);
    const niveau = niveauRequis(montant);
    await act(da, { offre_retenue_id: o.id, justification_choix: data.justification_choix, validation_achat_niveau: niveau, statut: "attente_validation_achat" },
      "Offre retenue et soumise à validation achat", `${o.fournisseur} — ${money(montant)} — niveau requis : ${niveau}`);
  },
  async validerAchat(form, data, d, da){
    if (d !== "valider" && !data.commentaire) throw new Error("Un commentaire est obligatoire pour un refus ou un renvoi.");
    if (d === "retour") return act(da, { statut: "consultation", offre_retenue_id: null }, "Achat renvoyé en consultation", data.commentaire);
    const base = { validation_achat_par: acteur() + " (" + user.role + ")", validation_achat_date: new Date().toISOString(), validation_achat_commentaire: data.commentaire };
    if (d === "valider") await act(da, Object.assign(base, { statut: "achat_valide" }), "Achat validé", data.commentaire);
    else await act(da, Object.assign(base, { statut: "refusee" }), "Achat refusé", data.commentaire);
  },
  async confirmerBC(form, data, d, da){
    await act(da, { bc_confirme: true, bc_delai_confirme: data.bc_delai_confirme }, "Commande confirmée par le fournisseur", "Livraison prévue le " + fmtDate(data.bc_delai_confirme));
  },
  async receptionner(form, data, d, da){
    const ctrl = {}; CTRL_RECEP.forEach((_, i) => ctrl["r" + i] = !!data["r" + i]);
    const qteOk = num(data.quantite_recue) >= num(da.quantite);
    const conforme = qteOk && Object.values(ctrl).every(Boolean);
    if (!conforme && !data.reception_remarque) throw new Error("Décrivez la non-conformité dans la remarque.");
    await act(da, {
      reception_date: data.reception_date, reception_par: acteur(), quantite_recue: num(data.quantite_recue),
      reception_controles: ctrl, reception_conforme: conforme, reception_remarque: data.reception_remarque,
      nc_signalee: conforme ? !!da.nc_signalee : true, statut: conforme ? "receptionnee" : "non_conforme"
    }, conforme ? "Réception conforme" : "Non-conformité signalée au service Achats", data.reception_remarque);
  },
  async traiterNC(form, data, d, da){
    await act(da, { nc_traitement: data.solution + " — " + data.detail, reserves_traitees: true, statut: "receptionnee" }, "Non-conformité traitée (réserves levées)", data.solution + " — " + data.detail);
  },
  async cloturer(form, data, d, da){
    if (!data.prestation_validee || !data.facture_conforme) throw new Error("La réception/prestation doit être validée et la facture conforme pour clôturer.");
    if (Math.abs(num(data.facture_montant) - num(da.bc_montant)) > 0.01 && !confirm("Le montant facturé diffère du montant du BC. Clôturer quand même ?")) return;
    await act(da, { facture_numero: data.facture_numero, facture_date: data.facture_date, facture_montant: num(data.facture_montant), facture_conforme: true, cloture_date: new Date().toISOString(), statut: "cloturee" },
      "DA clôturée", "Facture " + data.facture_numero + " — " + money(data.facture_montant));
  },
  async saveSettings(form, data){
    settings = Object.assign({}, settings, data, { seuil1: num(data.seuil1), seuil2: num(data.seuil2) });
    LS.set("da_settings", JSON.stringify(settings)); toast("Paramètres enregistrés");
  }
};

function download(name, content, type){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ===================== Données de démonstration ===================== */
async function seedDemo(){

/* ===================== Routeur & rendu ===================== */
function route(){
  const h = location.hash.replace(/^#/, "") || "/";
  const [path, qs] = h.split("?");
  const params = Object.fromEntries(new URLSearchParams(qs || ""));
  const parts = path.split("/").filter(Boolean);
  return { name: parts[0] || "dash", id: parts[1], params };
}
function render(){
  const r = route();
  document.querySelectorAll("#menu a").forEach(a => a.classList.toggle("active",
    a.dataset.r === r.name || (a.dataset.r === "dash" && r.name === "dash") || (a.dataset.r === "liste" && r.name === "da")));
  let html;
  switch (r.name){
    case "liste": html = viewListe(r.params); break;
    case "nouvelle": html = viewForm(null); break;
    case "modifier": { const da = findDA(r.id); html = da && CAN.modifier(da) ? viewForm(da) : viewDetail(da); break; }
    case "da": html = viewDetail(findDA(r.id)); break;
    case "parametres": html = viewParam(); break;
    default: html = viewDashboard();
  }
  $("#app").innerHTML = html;
  bindView();
}
function bindView(){
  const cat = $("#categorie"), urg = $("#urgence");
  if (cat) cat.onchange = () => { $("#bloc-pdr").style.display = cat.value === "Pièces de rechange" ? "" : "none"; };
  if (urg) urg.onchange = () => { $("#bloc-impact").style.display = urg.value !== "Normal" ? "" : "none"; };
  const fq = $("#f-q");
  if (fq){
    const upd = () => { filters = { q: $("#f-q").value, statut: $("#f-statut").value, urgence: $("#f-urgence").value, service: $("#f-service").value };
      history.replaceState(null, "", "#/liste"); const pos = fq.selectionStart; render(); const n = $("#f-q"); n.focus(); n.setSelectionRange(pos, pos); };
    fq.oninput = upd; ["#f-statut","#f-urgence","#f-service"].forEach(s => $(s).onchange = upd);
  }
}

/* Délégation d'événements */
document.addEventListener("click", async e => {
  const go = e.target.closest("[data-go]");
  if (go){ location.hash = go.dataset.go; return; }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  e.preventDefault();
  try { await ACTIONS[b.dataset.act](b, b.dataset.id ? findDA(b.dataset.id) : null); }
  catch(err){ console.error(err); toast(err.message, true); }
});
document.addEventListener("change", async e => {
  const s = e.target.closest("[data-change=conformite]");
  if (!s) return;
  try {
    const da = findDA(s.dataset.id), o = da.offres.find(x => x.id === s.dataset.offre);
    await store.updateOffre(s.dataset.offre, { conformite_technique: s.value });
    await act(da, null, "Avis technique : " + s.value, o.fournisseur);
  } catch(err){ toast(err.message, true); }
});
document.addEventListener("submit", async e => {
  const f = e.target.closest("form[data-form]");
  if (!f) return;
  e.preventDefault();
  const submitter = e.submitter;
  const decision = submitter && submitter.name ? submitter.value : null;
  const btns = f.querySelectorAll("button"); btns.forEach(x => x.disabled = true);
  try {
    const data = formObj(f); delete data._mode; delete data._d;
    const da = f.dataset.id ? findDA(f.dataset.id) : null;
    await FORMS[f.dataset.form](f, data, decision, da);
  } catch(err){ console.error(err); toast(err.message, true); }
  finally { btns.forEach(x => x.disabled = false); }
});
window.addEventListener("hashchange", render);

(async function init(){
  $("#u-role").innerHTML = opts(ROLES, user.role);
  $("#u-nom").value = user.nom;
  $("#u-nom").onchange = e => { user.nom = e.target.value.trim(); saveUser(); render(); };
  $("#u-role").onchange = e => { user.role = e.target.value; saveUser(); render(); };
  const m = $("#mode");
  if (USE_SUPABASE){
    try {
      await loadScript("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2");
      store = SupabaseStore(window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY));
      m.textContent = "Supabase"; m.classList.add("sb");
    } catch(err){
      toast("Supabase indisponible, bascule en mode local : " + err.message, true);
      m.textContent = "Mode test local";
    }
  } else m.textContent = "Mode test local";
  try { await reload(); }
  catch(err){ toast("Erreur de chargement : " + err.message, true); DB = []; }
  render();
})();
